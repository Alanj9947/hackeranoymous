[project]
name = "voice-agent-backend"
version = "1.0.0"
description = "AI Voice Agent Platform - Backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # Database
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    # Redis & Celery
    "redis>=5.0.0",
    "celery[redis]>=5.3.0",
    "flower>=2.0.0",
    # Pydantic
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.2.0",
    # External APIs
    "twilio>=9.0.0",
    "openai>=1.10.0",
    "elevenlabs>=0.2.0",
    "httpx>=0.26.0",
    # Google Sheets
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    # Export
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.1.0",
    # File storage
    "boto3>=1.34.0",
    # WebSocket
    "websockets>=12.0",
    # Socket.IO
    "python-socketio>=5.10.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "sentry-sdk[fastapi]>=1.39.0",
    "prometheus-client>=0.19.0",
    "psutil>=5.9.0",
    "cryptography>=41.0.0",
    "orjson>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "factory-boy>=3.3.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "alembic*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
